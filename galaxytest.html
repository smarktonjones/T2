<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebGPU Galaxy Simulator – Fixed (Billboard Quads)</title>
<style>
    body { margin:0; overflow:hidden; background:#000; font-family:Arial, sans-serif; }
    #gui {
        position:absolute; top:10px; left:50px; z-index:100;
        background:rgba(0,0,0,0.82); padding:14px; border-radius:8px; color:#fff;
        user-select:none; max-height:85vh; overflow-y:auto; overflow-x:hidden;
        font-size:13px; min-width:240px;
    }
    #gui label { display:block; margin:6px 0; }
    #gui input, #gui select, #gui button { width:100%; padding:5px; margin-top:3px; box-sizing:border-box; }
    #gui button { background:#0088ff; color:white; border:none; padding:9px; cursor:pointer; font-weight:bold; margin-top:8px; }
    #status { position:absolute; bottom:12px; left:12px; color:#0f0; font-family:monospace; font-size:13px; z-index:100; }
    canvas { display:block; }
</style>
</head>
<body>

<button id="toggleGui" style="position:absolute; top:10px; left:10px; z-index:101; background:rgba(0,0,0,0.7); color:white; border:none; padding:5px 10px; cursor:pointer; border-radius:4px;">Hide</button>

<div id="gui">
    <label>Particles <input type="number" id="num" value="120000" min="1000" max="800000" step="10000"></label>
    <label>Base Gravity <input type="number" id="grav" value="1.15" step="0.01"></label>
    <label>Velocity   <input type="number" id="vel" value="0.82" step="0.05"></label>
    <label>Size       <input type="number" id="size" value="3.2" step="0.1"></label>
    <label>Disk Radius<input type="number" id="radius" value="310" step="20"></label>
    <label>Thickness  <input type="number" id="thick" value="13" step="1"></label>
    <label>Sim Speed  <input type="number" id="speed" value="16" step="1"></label>
    <label>Reset Radius (0=off) <input type="number" id="resetR" value="460" step="20"></label>
    <label>Num Central Attractors <input type="number" id="numAttract" value="6" min="1" max="8" step="1"></label>
    <label>Attractor Distance <input type="number" id="attractDist" value="270" step="10"></label>
    <label>Audio Strength <input type="number" id="audioS" value="70" step="1"></label>
    <label>Sample Interval (ms) <input type="number" id="sampleInt" value="16" step="1" min="8"></label>
    <label>Audio Effect <select id="audioMode"><option value="multiply">Multiply</option><option value="add">Add</option></select></label>
    <label>Colorize <input type="checkbox" id="colorize" checked></label>
    <label>Color Radius <input type="number" id="colorRad" value="55" step="5"></label>
    <label>Acoustic Waves <input type="checkbox" id="acoustic" checked></label>
    <label>Wave Strength <input type="number" id="waveS" value="200" step="5"></label>
    <label>Wave Speed <input type="number" id="waveSpeed" value="850000" step="10000"></label>
    <label>Acoustic Visual <input type="checkbox" id="acousticVis" checked></label>
    <label>Visual Amount <input type="number" id="visAmt" value="3.5" step="0.5"></label>
    <label>Flicker Effect <input type="checkbox" id="flicker" checked></label>
    <label>Flicker Interval (s) <input type="number" id="flickFreq" value="7" step="0.5" min="0.5"></label>
    <label>Flicker Duration (s) <input type="number" id="flickSpeed" value="0.32" step="0.05"></label>
    <label>Flicker Magnitude <input type="number" id="flickMag" value="1.35" step="0.1"></label>
    <button id="startAudio">Start Audio Capture</button>
    <button id="restart">Restart Simulation</button>
    <button id="fullScreen">Full Screen</button>
</div>

<div id="status">Initializing WebGPU...</div>
<canvas id="c"></canvas>

<script type="module">
const canvas = document.getElementById('c');
const statusEl = document.getElementById('status');

if (!navigator.gpu) {
    statusEl.textContent = 'WebGPU is not supported in this browser';
    throw new Error('WebGPU not supported');
}

const adapter = await navigator.gpu.requestAdapter();
if (!adapter) {
    statusEl.textContent = 'No WebGPU adapter found';
    throw new Error('No adapter');
}
const device = await adapter.requestDevice();
const context = canvas.getContext('webgpu');
const format = navigator.gpu.getPreferredCanvasFormat();

function resize() {
    const dpr = Math.min(devicePixelRatio, 2);
    canvas.width  = innerWidth  * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width  = innerWidth  + 'px';
    canvas.style.height = innerHeight + 'px';
    context.configure({ device, format, alphaMode: 'opaque' });
}
resize();
window.addEventListener('resize', resize);

// ---------- Camera ----------
let camDist = 760, camTheta = 0.15, camPhi = 0.32;
let dragging = false, lastX = 0, lastY = 0;

canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('mouseup', () => dragging = false);
window.addEventListener('mousemove', e => {
    if (!dragging) return;
    camTheta += (e.clientX - lastX) * 0.005;
    camPhi   = Math.max(-1.35, Math.min(1.35, camPhi + (e.clientY - lastY) * 0.005));
    lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('wheel', e => {
    camDist *= e.deltaY > 0 ? 1.07 : 0.93;
    camDist = Math.max(100, Math.min(2200, camDist));
}, { passive: true });

function getViewProj() {
    const eye = [
        camDist * Math.cos(camPhi) * Math.sin(camTheta),
        camDist * Math.sin(camPhi),
        camDist * Math.cos(camPhi) * Math.cos(camTheta)
    ];
    const target = [0,0,0], up = [0,1,0];
    const z = normalize(sub(eye, target));
    const x = normalize(cross(up, z));
    const y = cross(z, x);

    const view = new Float32Array([
        x[0], y[0], z[0], 0,
        x[1], y[1], z[1], 0,
        x[2], y[2], z[2], 0,
       -dot(x,eye), -dot(y,eye), -dot(z,eye), 1
    ]);

    const aspect = canvas.width / canvas.height;
    const f = 1 / Math.tan(50 * Math.PI / 360);
    const near = 2, far = 3500, nf = 1/(near-far);
    const proj = new Float32Array([
        f/aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far+near)*nf, -1,
        0, 0, 2*far*near*nf, 0
    ]);
    return mul4(proj, view);
}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function normalize(v){const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l];}
function mul4(a,b){
    const r=new Float32Array(16);
    for(let i=0;i<4;i++) for(let j=0;j<4;j++)
        r[i*4+j]=a[i*4]*b[j]+a[i*4+1]*b[4+j]+a[i*4+2]*b[8+j]+a[i*4+3]*b[12+j];
    return r;
}

function wavelengthToRGB(wl) {
    let r=0,g=0,b=0;
    if(wl>=380&&wl<440){r=(440-wl)/60;b=1;}
    else if(wl<490){g=(wl-440)/50;b=1;}
    else if(wl<510){g=1;b=(510-wl)/20;}
    else if(wl<580){r=(wl-510)/70;g=1;}
    else if(wl<645){r=1;g=(645-wl)/65;}
    else if(wl<=780){r=1;}
    let f = wl>700 ? (780-wl)/80*0.3+0.7 : (wl<420 ? (wl-380)/40*0.3+0.7 : 1);
    return [Math.pow(r*f,0.8), Math.pow(g*f,0.8), Math.pow(b*f,0.8)];
}

// ---------- State ----------
let numParticles = 120000;
let particleBuffer, uniformBuffer;
let computePipeline, renderPipeline, computeBG, renderBG;
let simTime = 0;
let attractorPositions = [], attractorColors = [];

// Audio
let analyzer=null, audioContext=null, intervalId=null;
let current_amplitudes=[], current_amp=0, current_freq=440;

// Uniform buffer (256 bytes)
const UNIFORM_SIZE = 256;
const uniformData = new ArrayBuffer(UNIFORM_SIZE);
const uView = {
    viewProj:   new Float32Array(uniformData, 0, 16),
    params:     new Float32Array(uniformData, 64, 16),
    attractors: new Float32Array(uniformData, 128, 32)
};

// ============================================================
// WGSL – FIXED: Instanced Billboard Quads (no point-list / no gl_PointCoord)
// ============================================================
const computeWGSL = `
struct Particle {
    pos   : vec4f,   // xyz + flickerPhase
    vel   : vec4f,
    color : vec4f,
};

struct Uniforms {
    viewProj  : mat4x4f,
    params    : array<f32, 16>,
    attractors: array<vec4f, 8>,
};

@group(0) @binding(0) var<storage, read_write> particles : array<Particle>;
@group(0) @binding(1) var<uniform> uni : Uniforms;

fn hash(p : u32) -> f32 {
    var x = p;
    x = (x ^ 61u) ^ (x >> 16u);
    x = x + (x << 3u);
    x = x ^ (x >> 4u);
    x = x * 0x27d4eb2du;
    x = x ^ (x >> 15u);
    return f32(x) * (1.0 / 4294967295.0);
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) id : vec3u) {
    let i = id.x;
    if (i >= arrayLength(&particles)) { return; }

    var p = particles[i];
    let dt        = uni.params[0];
    let baseG     = uni.params[1];
    let waveS     = uni.params[2];
    let waveSpeed = uni.params[3];
    let amp       = uni.params[4];
    let freq      = uni.params[5];
    let visAmt    = uni.params[6];
    let flickMag  = uni.params[7];
    let resetR    = uni.params[8];
    let colorRad  = uni.params[9];
    let time      = uni.params[10];
    let flags     = u32(uni.params[11]);

    let acoustic_on = (flags & 1u) != 0u;
    let colorize_on = (flags & 2u) != 0u;
    let flicker_on  = (flags & 4u) != 0u;

    var pos   = p.pos.xyz;
    var vel   = p.vel.xyz;
    var col   = p.color.xyz;
    var phase = p.pos.w;

    // Gravity
    var accel = vec3f(0.0);
    var nearestDist = 1e10;
    var nearestIdx  = 0u;

    for (var a = 0u; a < 8u; a++) {
        let attr = uni.attractors[a];
        let G = attr.w;
        if (G <= 0.0) { continue; }
        let d  = attr.xyz - pos;
        let r2 = dot(d, d);
        if (r2 > 0.25) {
            let r = sqrt(r2);
            accel += d * (G / (r2 * r));
            if (r < nearestDist) {
                nearestDist = r;
                nearestIdx  = a;
            }
        }
    }

    // Acoustic force
    if (acoustic_on && amp > 0.0005) {
        let r2 = dot(pos, pos);
        if (r2 > 0.25) {
            let r = sqrt(r2);
            let k     = 6.283185307 * freq / max(waveSpeed, 1.0);
            let omega = 6.283185307 * freq;
            let force = waveS * amp * sin(omega * time - k * r) / r;
            accel += normalize(pos) * force;
        }
    }

    // Integrate
    vel += accel * dt;
    pos += vel * dt;

    // Reset far particles
    if (resetR > 1.0) {
        var minR2 = 1e20;
        for (var a = 0u; a < 8u; a++) {
            let attr = uni.attractors[a];
            if (attr.w <= 0.0) { continue; }
            let d = attr.xyz - pos;
            minR2 = min(minR2, dot(d, d));
        }
        if (minR2 > resetR * resetR) {
            let aidx = u32(hash(i + u32(time*173.0)) * 5.99) % 6u;
            let attr = uni.attractors[aidx];
            let phi  = hash(i*3u + 7u) * 6.283185307;
            let rr   = sqrt(hash(i*5u + 11u)) * 290.0;
            pos = attr.xyz + vec3f(rr*cos(phi), rr*sin(phi), (hash(i+13u)-0.5)*12.0);
            let v0  = sqrt(max(baseG,0.15) / max(rr,1.5)) * 0.82;
            vel = vec3f(-v0*sin(phi), v0*cos(phi), (hash(i+17u)-0.5)*0.015);
            phase = -1.0;
        }
    }

    // Colorize
    if (colorize_on && nearestDist < colorRad) {
        let t = f32(nearestIdx) / 5.0;
        col = vec3f(
            0.55 + 0.45 * sin(t * 6.2832),
            0.55 + 0.45 * sin(t * 6.2832 + 2.094),
            0.55 + 0.45 * sin(t * 6.2832 + 4.188)
        );
    }

    // Flicker
    if (flicker_on) {
        if (phase < 0.0) {
            if (hash(i + u32(time * 47.0)) < dt / 7.0) {
                phase = 0.0;
            }
        } else {
            phase += dt / 0.32;
            if (phase > 1.0) { phase = -1.0; }
        }
    }

    p.pos   = vec4f(pos, phase);
    p.vel   = vec4f(vel, 0.0);
    p.color = vec4f(col, 1.0);
    particles[i] = p;
}
`;

const renderWGSL = `
struct Particle {
    pos   : vec4f,
    vel   : vec4f,
    color : vec4f,
};

struct Uniforms {
    viewProj  : mat4x4f,
    params    : array<f32, 16>,
    attractors: array<vec4f, 8>,
};

@group(0) @binding(0) var<storage, read> particles : array<Particle>;
@group(0) @binding(1) var<uniform> uni : Uniforms;

struct VSOut {
    @builtin(position) position : vec4f,
    @location(0) color : vec4f,
    @location(1) uv : vec2f,
};

@vertex
fn vs_main(@builtin(instance_index) iid : u32, @builtin(vertex_index) vid : u32) -> VSOut {
    let p = particles[iid];
    var world = p.pos.xyz;

    // Acoustic visual displacement (purely visual)
    let visAmt    = uni.params[6];
    let amp       = uni.params[4];
    let freq      = uni.params[5];
    let waveSpeed = uni.params[3];
    let time      = uni.params[10];
    if (visAmt > 0.01 && amp > 0.0005) {
        let r = length(world);
        if (r > 0.8) {
            let k     = 6.283185307 * freq / max(waveSpeed, 1.0);
            let omega = 6.283185307 * freq;
            world += normalize(world) * (amp * sin(omega * time - k * r) * visAmt);
        }
    }

    // Billboard quad (6 vertices)
    let offsets = array<vec2f, 6>(
        vec2f(-1.0, -1.0),
        vec2f( 1.0, -1.0),
        vec2f(-1.0,  1.0),
        vec2f(-1.0,  1.0),
        vec2f( 1.0, -1.0),
        vec2f( 1.0,  1.0)
    );
    let uvs = array<vec2f, 6>(
        vec2f(0.0, 0.0),
        vec2f(1.0, 0.0),
        vec2f(0.0, 1.0),
        vec2f(0.0, 1.0),
        vec2f(1.0, 0.0),
        vec2f(1.0, 1.0)
    );

    let size = uni.params[12] * 0.9;
    let offset = offsets[vid] * size;

    // Simple camera-facing approximation (good enough for particles)
    let worldOffset = vec3f(offset.x, offset.y, 0.0);

    var out : VSOut;
    out.position = uni.viewProj * vec4f(world + worldOffset, 1.0);

    var col = p.color.xyz;
    let phase = p.pos.w;
    let flickMag = uni.params[7];
    if (phase >= 0.0) {
        let f = sin(phase * 3.14159265);
        col = mix(col, vec3f(1.0), f * flickMag * 0.85);
    }
    out.color = vec4f(col, 1.0);
    out.uv = uvs[vid];
    return out;
}

@fragment
fn fs_main(@location(0) color : vec4f, @location(1) uv : vec2f) -> @location(0) vec4f {
    let d = length(uv - vec2f(0.5));
    if (d > 0.5) { discard; }
    let alpha = (1.0 - smoothstep(0.25, 0.5, d)) * 0.92;
    return vec4f(color.rgb * 1.6, alpha);
}
`;

// ---------- GPU init ----------
async function initGPU(n) {
    numParticles = n;
    statusEl.textContent = `Creating ${n.toLocaleString()} particles...`;

    const particleByteSize = 48;
    particleBuffer = device.createBuffer({
        size: numParticles * particleByteSize,
        usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
        mappedAtCreation: true
    });

    const data = new Float32Array(particleBuffer.getMappedRange());
    initAttractors();

    const G     = +document.getElementById('grav').value;
    const velM  = +document.getElementById('vel').value;
    const R     = +document.getElementById('radius').value;
    const thick = +document.getElementById('thick').value;

    for (let i = 0; i < numParticles; i++) {
        const base = i * 12;
        const aidx = Math.floor(Math.random() * attractorPositions.length);
        const attr = attractorPositions[aidx];
        const phi  = Math.random() * Math.PI * 2;
        const r    = Math.sqrt(Math.random()) * R;

        data[base+0] = attr[0] + r * Math.cos(phi);
        data[base+1] = attr[1] + r * Math.sin(phi);
        data[base+2] = attr[2] + (Math.random()-0.5)*thick;
        data[base+3] = -1; // flicker phase

        const v0 = Math.sqrt(G / Math.max(r, 1)) * velM;
        data[base+4] = -v0 * Math.sin(phi) * (0.88 + Math.random()*0.24);
        data[base+5] =  v0 * Math.cos(phi) * (0.88 + Math.random()*0.24);
        data[base+6] = (Math.random()-0.5)*0.018;
        data[base+7] = 0;

        const rgb = attractorColors[aidx];
        data[base+8]  = rgb[0];
        data[base+9]  = rgb[1];
        data[base+10] = rgb[2];
        data[base+11] = 1;
    }
    particleBuffer.unmap();

    uniformBuffer = device.createBuffer({
        size: UNIFORM_SIZE,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
    });

    const computeModule = device.createShaderModule({ code: computeWGSL });
    const renderModule  = device.createShaderModule({ code: renderWGSL });

    // Check for shader errors
    const computeInfo = await computeModule.getCompilationInfo();
    const renderInfo  = await renderModule.getCompilationInfo();
    for (const msg of [...computeInfo.messages, ...renderInfo.messages]) {
        if (msg.type === 'error') {
            console.error('WGSL Error:', msg.message, 'line', msg.lineNum);
            statusEl.textContent = 'WGSL Error – see console';
            throw new Error(msg.message);
        }
    }

    computePipeline = device.createComputePipeline({
        layout: 'auto',
        compute: { module: computeModule, entryPoint: 'main' }
    });

    renderPipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: {
            module: renderModule,
            entryPoint: 'vs_main'
        },
        fragment: {
            module: renderModule,
            entryPoint: 'fs_main',
            targets: [{
                format,
                blend: {
                    color: { srcFactor: 'src-alpha', dstFactor: 'one', operation: 'add' },
                    alpha: { srcFactor: 'one', dstFactor: 'one', operation: 'add' }
                }
            }]
        },
        primitive: { topology: 'triangle-list' }
    });

    computeBG = device.createBindGroup({
        layout: computePipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: { buffer: particleBuffer } },
            { binding: 1, resource: { buffer: uniformBuffer } }
        ]
    });

    renderBG = device.createBindGroup({
        layout: renderPipeline.getBindGroupLayout(0),
        entries: [
            { binding: 0, resource: { buffer: particleBuffer } },
            { binding: 1, resource: { buffer: uniformBuffer } }
        ]
    });

    statusEl.textContent = `Ready – ${numParticles.toLocaleString()} particles (WebGPU Compute + Billboards)`;
}

function initAttractors() {
    const numAttract = +document.getElementById('numAttract').value;
    const attractDist = +document.getElementById('attractDist').value;
    attractorPositions = [];
    attractorColors = [];

    if (numAttract === 1) {
        attractorPositions.push([0, 0, 0]);
    } else {
        const offset = (numAttract - 1) * attractDist / 2;
        for (let i = 0; i < numAttract; i++) {
            attractorPositions.push([i * attractDist - offset, 0, 0]);
        }
    }
    const minWL = 400, maxWL = 700;
    for (let i = 0; i < numAttract; i++) {
        const wl = minWL + (i + 0.5) / numAttract * (maxWL - minWL);
        attractorColors.push(wavelengthToRGB(wl));
    }
}

// ---------- Audio ----------
async function startAudioCapture() {
    try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        stream.getVideoTracks().forEach(t => t.stop());
        audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        analyzer = audioContext.createAnalyser();
        analyzer.fftSize = 2048;
        source.connect(analyzer);
        updateInterval();
        statusEl.textContent = 'Audio capture started';
    } catch (e) {
        console.error(e);
        statusEl.textContent = 'Audio capture failed';
    }
}

function updateFrequencies() {
    if (!analyzer) return;
    const data = new Uint8Array(analyzer.frequencyBinCount);
    analyzer.getByteFrequencyData(data);

    const n = Math.max(1, attractorPositions.length);
    const bins = Math.floor(data.length / n);
    current_amplitudes = [];
    for (let b = 0; b < n; b++) {
        let sum = 0, cnt = 0;
        const start = b * bins;
        const end = (b === n - 1) ? data.length : (b + 1) * bins;
        for (let k = start; k < end; k++) {
            const v = data[k] / 255;
            sum += v * v;
            cnt++;
        }
        current_amplitudes.push(Math.sqrt(sum / Math.max(cnt, 1)));
    }

    let sumMag = 0, weighted = 0;
    const nyquist = audioContext.sampleRate / 2;
    for (let k = 0; k < data.length; k++) {
        const mag = data[k] / 255;
        sumMag += mag;
        weighted += mag * (k / data.length) * nyquist;
    }
    current_amp = sumMag / data.length;
    current_freq = sumMag > 0 ? weighted / sumMag : 440;
}

function updateInterval() {
    if (intervalId) clearInterval(intervalId);
    intervalId = setInterval(updateFrequencies, +document.getElementById('sampleInt').value);
}

// ---------- Frame ----------
function frame() {
    requestAnimationFrame(frame);

    const dt = 0.016 * (+document.getElementById('speed').value / 16);
    simTime += dt;

    // Update uniforms
    uView.viewProj.set(getViewProj());

    const G = +document.getElementById('grav').value;
    const audioS = +document.getElementById('audioS').value;
    const audioMode = document.getElementById('audioMode').value;
    const acoustic_on = document.getElementById('acoustic').checked;
    const colorize_on = document.getElementById('colorize').checked;
    const flicker_on = document.getElementById('flicker').checked;

    uView.params[0] = dt;
    uView.params[1] = G;
    uView.params[2] = +document.getElementById('waveS').value;
    uView.params[3] = +document.getElementById('waveSpeed').value;
    uView.params[4] = current_amp;
    uView.params[5] = current_freq;
    uView.params[6] = document.getElementById('acousticVis').checked ? +document.getElementById('visAmt').value : 0;
    uView.params[7] = flicker_on ? +document.getElementById('flickMag').value : 0;
    uView.params[8] = +document.getElementById('resetR').value;
    uView.params[9] = +document.getElementById('colorRad').value;
    uView.params[10] = simTime;
    uView.params[12] = +document.getElementById('size').value;

    let flags = 0;
    if (acoustic_on) flags |= 1;
    if (colorize_on) flags |= 2;
    if (flicker_on)  flags |= 4;
    if (audioMode === 'multiply') flags |= 8;
    uView.params[11] = flags;

    // Attractors + effective G
    for (let i = 0; i < 8; i++) {
        const base = i * 4;
        if (i < attractorPositions.length) {
            const amp = current_amplitudes[i] || 0;
            let effG = G;
            if (analyzer) {
                effG = (audioMode === 'multiply') ? G * (1 + amp * audioS) : G + amp * audioS;
            }
            uView.attractors[base + 0] = attractorPositions[i][0];
            uView.attractors[base + 1] = attractorPositions[i][1];
            uView.attractors[base + 2] = attractorPositions[i][2];
            uView.attractors[base + 3] = effG;
        } else {
            uView.attractors[base + 3] = 0;
        }
    }

    device.queue.writeBuffer(uniformBuffer, 0, uniformData);

    // Compute
    const encoder = device.createCommandEncoder();
    const computePass = encoder.beginComputePass();
    computePass.setPipeline(computePipeline);
    computePass.setBindGroup(0, computeBG);
    computePass.dispatchWorkgroups(Math.ceil(numParticles / 64));
    computePass.end();

    // Render
    const renderPass = encoder.beginRenderPass({
        colorAttachments: [{
            view: context.getCurrentTexture().createView(),
            clearValue: { r: 0, g: 0, b: 0, a: 1 },
            loadOp: 'clear',
            storeOp: 'store'
        }]
    });
    renderPass.setPipeline(renderPipeline);
    renderPass.setBindGroup(0, renderBG);
    renderPass.draw(6, numParticles); // 6 vertices per particle (quad)
    renderPass.end();

    device.queue.submit([encoder.finish()]);

    statusEl.textContent = `Particles: ${numParticles.toLocaleString()} | WebGPU Compute + Billboards`;
}

// ---------- UI ----------
document.getElementById('restart').addEventListener('click', async () => {
    const n = +document.getElementById('num').value;
    await initGPU(n);
});
document.getElementById('startAudio').addEventListener('click', startAudioCapture);
document.getElementById('sampleInt').addEventListener('change', updateInterval);
document.getElementById('fullScreen').addEventListener('click', () => canvas.requestFullscreen());

const gui = document.getElementById('gui');
const toggleGui = document.getElementById('toggleGui');
toggleGui.addEventListener('click', () => {
    if (gui.style.display === 'none') {
        gui.style.display = 'block';
        toggleGui.textContent = 'Hide';
    } else {
        gui.style.display = 'none';
        toggleGui.textContent = 'Show';
    }
});

// Start
try {
    await initGPU(+document.getElementById('num').value);
    frame();
} catch (err) {
    console.error(err);
    statusEl.textContent = 'Initialization failed – see console';
}
</script>
</body>
