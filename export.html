<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Firestore History Exporter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 600px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9; }
        .hidden { display: none !important; }
        input { width: calc(100% - 20px); padding: 8px; margin-bottom: 10px; font-size: 1em; }
        button { font-size: 1.1em; padding: 10px 20px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 5px; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #user-status { text-align: right; margin-bottom: 20px; }
        #log-output { background-color: #e9ecef; padding: 10px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; min-height: 50px; }
        #error-message { color: #d93025; font-weight: bold; }
    </style>
</head>
<body>

    <h1>DentalNoteMaker - Secure History Exporter</h1>

    <!-- View for Logged-In Users -->
    <div id="exporter-view" class="container hidden">
        <div id="user-status">
            Logged in as: <b id="user-email"></b> | <a href="#" id="logout-btn">Logout</a>
        </div>
        
        <p>This tool will fetch the most recent notes from your 'history_notes' collection.</p>
        
        <!-- THIS IS THE NEW PART -->
        <label for="limit-input"><b>Number of recent notes to export:</b></label>
        <input type="number" id="limit-input" value="500" min="1" max="5000">
        <!-- END OF NEW PART -->

        <button id="export-btn">Export History Data</button>
        <hr>
        <h3>Log:</h3>
        <pre id="log-output">Waiting to start...</pre>
    </div>

    <!-- View for Logged-Out Users -->
    <div id="login-view" class="container">
        <h2>Please Log In</h2>
        <p>You must be authenticated to export data.</p>
        <input type="email" id="email-input" placeholder="Enter your email">
        <input type="password" id="password-input" placeholder="Enter your password">
        <button id="login-btn">Login</button>
        <p id="error-message"></p>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyAlNh7VeqECL0vYM-1eeHGsRtln2d8AqT8",
          authDomain: "dentalnotemaker.firebaseapp.com",
          projectId: "dentalnotemaker",
          storageBucket: "dentalnotemaker.firebasestorage.app",
          messagingSenderId: "402426997147",
          appId: "1:402426997147:web:35c60dbbfe96390f79593e"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        const loginView = document.getElementById('login-view');
        const exporterView = document.getElementById('exporter-view');
        const userEmailDisplay = document.getElementById('user-email');
        const errorMessage = document.getElementById('error-message');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const exportBtn = document.getElementById('export-btn');
        const logOutput = document.getElementById('log-output');
        const limitInput = document.getElementById('limit-input');

        auth.onAuthStateChanged(user => {
            if (user) {
                loginView.classList.add('hidden');
                exporterView.classList.remove('hidden');
                userEmailDisplay.textContent = user.email;
            } else {
                exporterView.classList.add('hidden');
                loginView.classList.remove('hidden');
                userEmailDisplay.textContent = '';
            }
        });

        loginBtn.addEventListener('click', () => {
            auth.signInWithEmailAndPassword(emailInput.value, passwordInput.value)
                .catch(error => errorMessage.textContent = error.message);
        });

        logoutBtn.addEventListener('click', (e) => { e.preventDefault(); auth.signOut(); });

        const exportHistoryToJSON = async () => {
            const limit = parseInt(limitInput.value, 10);
            if (!limit || limit <= 0) {
                logOutput.textContent = "Error: Please enter a valid number of notes to export.";
                return;
            }

            logOutput.textContent = `Connecting to Firestore and fetching the latest ${limit} documents...`;
            exportBtn.disabled = true;

            try {
                // --- THIS IS THE KEY CHANGE ---
                // We order by timestamp and apply the user's limit.
                const snapshot = await db.collection('history_notes')
                                         .orderBy('timestamp', 'desc')
                                         .limit(limit)
                                         .get();
                // -----------------------------
                
                const historyData = [];
                snapshot.forEach(doc => historyData.push(doc.data()));

                logOutput.textContent = `Successfully fetched ${historyData.length} documents. Preparing download...`;

                const jsonString = JSON.stringify(historyData, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `firestore_history_export_${limit}_notes.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                logOutput.textContent += "\n\nExport complete!";

            } catch (error) {
                console.error("Export failed:", error);
                logOutput.textContent = `Error: Export failed. Check console for details.\n\nMessage: ${error.message}`;
            } finally {
                exportBtn.disabled = false;
            }
        };

        exportBtn.addEventListener('click', exportHistoryToJSON);
    </script>
</body>
</html>
